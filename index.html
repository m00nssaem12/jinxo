<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>징크스오 · 같은 답 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#211c4a; --bg2:#2d2766; --ink:#24213f; --paper:#fffaf0; --yellow:#ffd23f; --pink:#ff4f81;
  --teal:#2ec4b6; --red:#e63946; --t0:#ff7b6b; --t1:#4dabf7; --t2:#5ccf6e; --muted:#8a86b5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 20% 0%,#3b3285 0,var(--bg) 55%);color:#fff;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh}
h1,h2,h3,.jua,button,.btn{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
button{cursor:pointer;border:none;border-radius:14px;padding:12px 18px;font-size:18px;background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
button.pink{background:var(--pink);color:#fff}
button.teal{background:var(--teal);color:#fff}
button.sm{padding:7px 12px;font-size:15px;border-radius:10px}
button:disabled{opacity:.45;pointer-events:none}
input,textarea,select{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
.hidden{display:none!important}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:#c9c5f0;opacity:.85}
.logo{font-family:'Jua',sans-serif;letter-spacing:1px;line-height:1}
.logo .j{color:var(--yellow)} .logo .o{display:inline-block;color:var(--pink);transform:rotate(-8deg)}
.credit{position:fixed;right:10px;bottom:6px;font-size:12px;opacity:.5;pointer-events:none}
.modebar{position:fixed;left:0;right:0;top:0;background:#ff9f1c;color:#3a2300;font-size:13px;text-align:center;padding:3px;z-index:50;font-family:'Jua'}

/* 홈 */
.home{max-width:460px;margin:0 auto;padding:60px 20px 40px}
.home .logo{font-size:64px;text-align:center}
.home .sub{text-align:center;margin:8px 0 30px;color:#d8d4ff}
.card{background:var(--bg2);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.card h3{margin:0 0 12px;font-size:22px}
.card input{margin-bottom:10px}
.card button{width:100%}

/* 보드 */
.board{display:grid;grid-template-columns:repeat(3,1fr) 30px;grid-template-rows:repeat(3,1fr) 30px;gap:7px;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1.0;padding:10px;background:var(--yellow);border-radius:18px;box-shadow:0 6px 0 #c99a10}
.cell{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-family:'Jua';font-size:clamp(14px,4.6vw,22px);padding:6px 4px;overflow:hidden;word-break:keep-all;line-height:1.15;user-select:none}
.cell.l2{font-size:clamp(12px,3.8vw,18px)} .cell.l3{font-size:clamp(10px,3.1vw,15px)}
.cell.empty{background:#fff3d6;color:#c8b48a}
.cell.click{cursor:pointer;animation:pulse 1.6s infinite}
.board.calm .cell.click{animation:none}
.cell.click:hover{border-color:var(--pink)}
.cell.sel{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink) inset}
.cell.hl{box-shadow:0 0 0 4px var(--teal) inset}
.cell .tag{position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;font-size:11px;line-height:16px;color:#fff;font-family:'Jua'}
.cell.tp0 .tag{background:var(--t0)} .cell.tp1 .tag{background:var(--t1)} .cell.tp2 .tag{background:var(--t2)}
.cell.tp0{border-bottom:6px solid var(--t0)} .cell.tp1{border-bottom:6px solid var(--t1)} .cell.tp2{border-bottom:6px solid var(--t2)}
.cell .star{position:absolute;right:3px;top:0;font-size:18px;color:transparent;-webkit-text-stroke:1.4px #d4a40a}
.cell.star-on .star{color:var(--yellow);-webkit-text-stroke:1.4px #a87b00;animation:pop .5s}
.cell.m-o::after{content:'';position:absolute;inset:9% 6%;border:4px solid var(--red);border-radius:50%;transform:rotate(-6deg);opacity:.85;animation:draw .35s}
.cell.m-x{color:#9b97b0}
.cell.m-x::after{content:'';position:absolute;inset:14%;background:linear-gradient(45deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%);opacity:.8}
.bonus{display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(0,0,0,.12);color:#8a6a00;font-family:'Jua';font-size:14px}
.bonus.on{background:var(--pink);color:#fff;animation:pop .5s}
.board.mini{max-width:none;padding:5px;gap:3px;grid-template-columns:repeat(3,1fr) 14px;grid-template-rows:repeat(3,1fr) 14px;border-radius:10px;box-shadow:none}
.board.mini .cell{font-size:12px;border-width:2px;border-radius:6px;padding:2px}
.board.mini .cell .tag{display:none} .board.mini .cell .star{font-size:11px}
.board.mini .cell.m-o::after{border-width:2px}
.board.mini .bonus{font-size:9px;border-radius:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.96)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes draw{from{transform:rotate(-40deg) scale(.4);opacity:0}}
@keyframes rise{from{transform:translateY(20px);opacity:0}}

/* 학생 */
.stu{max-width:520px;margin:0 auto;padding:12px 12px 120px}
.stu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stu .me{font-family:'Jua';font-size:20px}
.pill{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-family:'Jua';font-size:15px}
.pill.y{background:var(--yellow);color:var(--ink)}
.banner{background:var(--bg2);border-radius:18px;padding:14px 16px;margin-bottom:12px;text-align:center;animation:rise .3s}
.banner .big{font-family:'Jua';font-size:28px;line-height:1.25}
.banner .mid{font-family:'Jua';font-size:20px}
.banner .small{font-size:15px;color:#d8d4ff;margin-top:4px}
.topicbox{display:inline-block;border-radius:14px;padding:6px 16px;font-family:'Jua';font-size:26px;color:#fff;margin:4px 0}
.topicbox.t0{background:var(--t0)} .topicbox.t1{background:var(--t1)} .topicbox.t2{background:var(--t2)}
.called{display:inline-block;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:8px 22px;font-family:'Jua';font-size:34px;margin:6px 0;animation:pop .4s}
.cands{display:grid;gap:10px;margin-top:10px}
.cands button{font-size:22px;padding:16px}
.actions{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vote-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin-top:8px}
.vote-item .who{font-family:'Jua';font-size:20px;text-align:left}
.vote-item .who small{display:block;font-family:'Gowun Dodum';font-size:13px;opacity:.8}
.vote-item button.on{outline:4px solid #fff}
.cd{font-family:'Jua';color:var(--yellow)}
.breakdown{display:flex;justify-content:center;gap:14px;font-family:'Jua';font-size:20px;margin-top:8px;flex-wrap:wrap}

/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
#sheet .in{background:var(--bg2);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px 26px;animation:rise .2s}
#sheet .in h3{margin:0 0 10px;font-size:22px}
#sheet .chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#sheet .chips button{font-size:15px;padding:7px 12px}
#sheet .chips button.t0{background:var(--t0);color:#fff} #sheet .chips button.t1{background:var(--t1);color:#fff} #sheet .chips button.t2{background:var(--t2);color:#fff}
#sheet .chips button.off{opacity:.35}
#sheet .warn{color:#ffb3c6;font-size:15px;min-height:20px;margin:6px 0}
#toast{position:fixed;left:50%;top:40px;transform:translateX(-50%);background:var(--pink);color:#fff;padding:10px 18px;border-radius:12px;font-family:'Jua';font-size:18px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* 선생님(전자칠판) */
.host{display:grid;grid-template-columns:1fr minmax(260px,24vw);grid-template-rows:auto 1fr auto;height:100vh;gap:14px;padding:16px 18px 22px}
.host .hd{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:12px}
.host .hd .logo{font-size:44px}
.host .code{font-family:'Jua';font-size:22px;background:var(--bg2);padding:8px 18px;border-radius:14px}
.host .code b{font-size:34px;color:var(--yellow);letter-spacing:4px;margin-left:6px}
.host .stage{background:var(--bg2);border-radius:24px;padding:24px;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;position:relative}
.host .stage>:first-child{margin-top:auto}.host .stage>:last-child{margin-bottom:auto}
body.hasbar{padding-top:24px}body.hasbar .host{height:calc(100vh - 24px)}
.host .side{background:var(--bg2);border-radius:24px;padding:14px;overflow:auto}
.host .ctrl{grid-column:1/2;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.host .huge{font-family:'Jua';font-size:clamp(40px,6vw,96px);line-height:1.1}
.host .big{font-family:'Jua';font-size:clamp(26px,3.2vw,48px)}
.host .mid{font-family:'Jua';font-size:clamp(20px,2vw,30px)}
.host .topicbox{font-size:clamp(34px,5vw,80px);padding:10px 34px;border-radius:24px}
.host .called{font-size:clamp(44px,6.5vw,110px);padding:10px 44px;border-width:6px;border-radius:26px}
.host .cdbig{font-family:'Jua';font-size:clamp(30px,3vw,52px);color:var(--yellow)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;font-size:17px}
.plist li:nth-child(odd){background:rgba(255,255,255,.05)}
.plist li.act{background:var(--yellow);color:var(--ink)}
.plist .dot{width:9px;height:9px;border-radius:50%;background:#5ccf6e;flex:none}
.plist .dot.off{background:#777}
.plist .nm{flex:1;font-family:'Jua';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .st{font-size:14px;opacity:.85;min-width:28px;text-align:right}
.plist .sc{font-family:'Jua';min-width:30px;text-align:right;color:var(--yellow)}
.plist li.act .sc{color:var(--ink)}
.plist .kick{background:none;box-shadow:none;color:#ff9db5;padding:0 4px;font-size:16px}
.side h3{margin:2px 4px 10px;font-size:20px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{background:var(--teal);color:#fff;border-radius:999px;padding:6px 14px;font-family:'Jua';font-size:clamp(16px,1.5vw,24px);animation:pop .4s}
.chip.p{background:var(--pink)}
.chip.g{background:rgba(255,255,255,.15)}
.hcards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.hcards button{font-size:clamp(24px,2.6vw,40px);padding:24px 30px;min-width:220px;border-radius:20px}
.prog{width:70%;height:22px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin:16px auto 6px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .4s}
.settings{display:grid;grid-template-columns:auto 120px;gap:10px 14px;align-items:center;text-align:left;max-width:560px;width:100%;margin-top:16px;font-size:18px}
.settings input{padding:8px 10px;font-size:18px}
.settings textarea{grid-column:1/3;height:110px;font-size:16px}
.hvote{width:min(820px,100%);margin-top:14px}
.hvote .vote-item{font-size:20px}
.hvote .who{font-size:clamp(20px,2vw,30px)!important}
.tally{font-family:'Jua';font-size:24px;min-width:130px}
.rank{width:min(760px,100%);border-collapse:collapse;margin-top:14px;font-size:clamp(18px,1.7vw,26px)}
.rank td,.rank th{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.rank th{font-family:'Jua';font-weight:400;color:#c9c5f0}
.rank td.n{font-family:'Jua';color:var(--yellow);text-align:right}
.rank tr.top td{background:rgba(255,210,63,.12)}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;width:100%;margin-top:14px}
.boards .nm{font-family:'Jua';margin-bottom:4px;font-size:16px}
.result-jinx{font-family:'Jua';font-size:clamp(70px,10vw,170px);color:var(--yellow);text-shadow:0 6px 0 var(--pink);animation:pop .6s}
.result-miss{font-family:'Jua';font-size:clamp(50px,7vw,120px);color:#ff9db5;animation:pop .5s}
.result-match{font-family:'Jua';font-size:clamp(50px,7vw,120px);color:var(--teal);animation:pop .5s}
.hist{margin-top:22px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:18px;opacity:.9}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center;margin:20px 0}
.podium div{background:var(--yellow);color:var(--ink);border-radius:16px 16px 0 0;width:180px;font-family:'Jua';font-size:26px;padding:12px;display:flex;flex-direction:column;justify-content:flex-start;animation:rise .6s}
.podium .p1{height:220px;background:var(--yellow)} .podium .p2{height:160px;background:#dfe3ee} .podium .p3{height:120px;background:#f0b27a}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:45;text-align:center;padding:20px}
@media (max-width:900px){
  .host{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
  .host .hd,.host .ctrl{grid-column:1}
}

/* ===== 원작 느낌 팝아트 테마 ===== */
:root{--bg2:#4b1f7a;--purple:#7a1fa2;--mag:#e6007e}
body{background:
  radial-gradient(circle at 8% 12%,rgba(230,0,126,.18) 0 60px,transparent 61px),
  radial-gradient(circle at 92% 88%,rgba(32,191,107,.22) 0 90px,transparent 91px),
  radial-gradient(circle at 85% 8%,rgba(47,128,237,.18) 0 40px,transparent 41px),
  repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px),
  linear-gradient(160deg,#ffd93b,#ffc21a);background-attachment:fixed}
.logo .j{color:#ffe14d;-webkit-text-stroke:2px var(--purple);text-shadow:4px 4px 0 var(--mag),7px 7px 0 var(--purple)}
.logo .o{display:inline-block;background:#fff;color:var(--mag);border:5px solid var(--purple);border-radius:50%;width:1.05em;height:1.05em;line-height:.98em;text-align:center;margin-left:.08em;box-shadow:4px 4px 0 var(--mag);transform:rotate(-8deg);-webkit-text-stroke:0}
.home .tag{width:max-content;margin:14px auto 0;background:var(--mag);color:#fff;font-family:'Jua';font-size:18px;padding:4px 16px;border-radius:999px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--purple)}
.home .sub{color:var(--purple);font-weight:700}
.card,.banner,.host .stage,.host .side{box-shadow:6px 6px 0 var(--mag)}
.credit{color:var(--purple);opacity:.7}
#h-info{color:var(--purple)} #h-info span{color:var(--mag)!important}
.host .code{box-shadow:4px 4px 0 var(--mag)}
button{box-shadow:0 4px 0 rgba(60,10,90,.45)}
button.ghost{background:#8a55c9;color:#fff;box-shadow:0 4px 0 rgba(60,10,90,.45)}
.stu .me{color:var(--purple)}
.stu .pill{background:var(--purple);color:#fff} .stu .pill.y{background:var(--mag);color:#fff}
/* 보드 */
.board{background:var(--fr);box-shadow:5px 5px 0 rgba(60,10,90,.55);border:4px solid var(--purple);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.cell{border-color:#3a2a55;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.cell.empty{background:#fffdf6;color:#d6cbb0}
.cell .star{-webkit-text-stroke:1.4px #b48a00}
.bonus{background:none;border-radius:0}
.bonus span{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--purple);color:var(--purple);font-family:'Jua';font-size:15px}
.bonus.on span{background:var(--mag);color:#fff;border-color:#fff;animation:pop .5s}
.board.mini .bonus{background:none}
.board.mini .bonus span{width:13px;height:13px;border-width:1.5px;font-size:8px}
.scorestrip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin:12px auto 0;max-width:420px;background:#fff;color:var(--ink);border:3px solid var(--purple);border-radius:14px;padding:8px 10px;font-size:15px;box-shadow:4px 4px 0 var(--mag)}
.scorestrip b{font-family:'Jua';color:var(--mag)} .scorestrip .tot b{font-size:20px}
.hcards button{min-width:280px}

.plist .rk{min-width:24px;text-align:center;font-family:'Jua';font-size:15px;opacity:.9}
.rankbox{margin:14px auto 0;max-width:420px;background:var(--bg2);border-radius:16px;padding:10px 14px;box-shadow:5px 5px 0 var(--mag)}
.rankbox .rt{font-family:'Jua';font-size:18px;margin-bottom:6px;display:flex;justify-content:space-between}
.rankbox .rt small{font-size:14px;opacity:.75}
.rrow{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;font-size:16px}
.rrow .rk{min-width:34px;font-family:'Jua'} .rrow .nm{flex:1;font-family:'Jua'} .rrow b{font-family:'Jua';color:var(--yellow)}
.rrow.me{background:var(--yellow);color:var(--ink)} .rrow.me b{color:var(--mag)}
.rdots{text-align:center;opacity:.6;line-height:.8}

.pend{margin-top:14px;width:min(900px,100%)}
.pend .pl{font-family:'Jua';font-size:17px}
.pend .pl b{color:#ff9db5}
.pend.big .pl{font-size:clamp(20px,1.9vw,28px)}
.pend .chip.w{background:#fff;color:var(--mag);border:3px solid var(--mag);animation:none}
.pend.big .chip.w{font-size:clamp(18px,1.6vw,26px)}
.pend.done{font-family:'Jua';font-size:20px;color:#7ef0a8}
.plist li.wait{background:rgba(230,0,126,.35)!important}
.plist li.wait .st{color:#ffd1e3;font-weight:700}

.lobby{display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:wrap}
.qrcard{background:#fff;border-radius:22px;padding:14px 14px 8px;box-shadow:6px 6px 0 var(--mag);cursor:pointer}
.qrcard svg{width:min(30vh,300px);height:min(30vh,300px);display:block}
.qrhint{color:var(--purple);font-family:'Jua';font-size:16px;margin-top:4px}
.lobinfo{display:flex;flex-direction:column;align-items:center;gap:10px}
.bigcode{font-family:'Jua';font-size:clamp(60px,8vw,120px);color:var(--yellow);letter-spacing:10px;line-height:1}
.lobinfo .url{background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:10px;font-size:15px;word-break:break-all;max-width:420px}
.lobplayers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;max-width:900px}
.lp{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:999px;padding:6px 6px 6px 16px;font-family:'Jua';font-size:clamp(18px,1.6vw,24px);animation:pop .35s}
.lp.off{opacity:.45}
.lp button{background:var(--mag);color:#fff;border-radius:50%;width:30px;height:30px;padding:0;font-size:15px;box-shadow:none}
.setbox{margin-top:18px;width:min(600px,100%);text-align:left}
.setbox summary{font-family:'Jua';font-size:20px;cursor:pointer;text-align:center;padding:8px;background:rgba(255,255,255,.08);border-radius:12px}
.qrbig{cursor:pointer}
.qrbox{background:#fff;padding:18px;border-radius:24px}
.qrbox svg{width:min(62vh,80vw);height:min(62vh,80vw);display:block}
.stopbtn{background:#3a2a55!important}

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

      if(FIREBASE_CONFIG.databaseURL && !forceLocal){
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG); fdb = firebase.database(); mode='fb';
        fdb.ref('.info/serverTimeOffset').on('value', s=>{ offset = s.val()||0; });
      } else {
        mode='mock';
        try{ tree = JSON.parse(localStorage.getItem('jinxo_mock_db')||'{}')||{}; }catch(e){ tree={}; }
        bc = new BroadcastChannel('jinxo_mock');
        bc.onmessage = e => { e.data.forEach(([p,v])=>applyOne(P(p),v)); notify(); };
      }
    },
    now(){ return Date.now()+offset; },
    set(path,val){ if(mode==='fb') return fdb.ref(path).set(val===undefined?null:val); return mockWrite([[path,val]]); },
    update(path,obj){ if(mode==='fb') return fdb.ref(path).update(obj); return mockWrite(Object.keys(obj).map(k=>[path+'/'+k,obj[k]])); },
    remove(path){ return this.set(path,null); },
    get(path){ if(mode==='fb') return fdb.ref(path).once('value').then(s=>s.val()); const v=getAt(P(path)); return Promise.resolve(v==null?null:JSON.parse(JSON.stringify(v))); },
    on(path,cb){
      if(mode==='fb'){ const ref=fdb.ref(path); const h=s=>cb(s.val()); ref.on('value',h); return ()=>ref.off('value',h); }
      const l={parts:P(path),cb,last:undefined}; listeners.push(l); notify(); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); };
    },
    presence(path){ // path 에 true 를 두고, 연결이 끊기면 지움. 멈추는 함수를 돌려줌
      if(mode==='fb'){
        const ref=fdb.ref(path), con=fdb.ref('.info/connected');
        const h=s=>{ if(s.val()){ ref.onDisconnect().remove(); ref.set(true); } };
        con.on('value',h);
        return ()=>{ con.off('value',h); ref.onDisconnect().cancel(); ref.remove(); };
      }
      this.set(path,true); const h=()=>this.remove(path); addEventListener('pagehide',h);
      return ()=>{ removeEventListener('pagehide',h); this.remove(path); };
    }
  };
})();

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFC').toLowerCase().replace(/[\s.,!?~\-_'"·‧()\[\]{}:;]/g,'');
const rid = () => Math.random().toString(36).slice(2,10);
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8]];
const NUM = ['①','②','③'];
const PALETTE=['#2f80ed','#f2711c','#eb3b5a','#20bf6b','#8854d0','#0fb9b1','#e84393'];
function pcolor(pid){ let h=0; for(const ch of String(pid)) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
const rand = n => Math.floor(Math.random()*n);
function hashName(s){ let h=5381; for(const ch of s) h=((h<<5)+h+ch.codePointAt(0))>>>0; return 'p'+h.toString(36)+s.length; }
function toast(msg,ms=1800){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }
// 남은 초 숫자는 따로 갱신하므로, 비교할 때는 빼고 비교 → 1초마다 화면이 다시 그려지며 깜빡이는 것 방지
function setHTML(el,html){ if(!el) return; const key=html.replace(/(data-dl="\d+"[^>]*>)\d+</g,'$1<'); if(el._h!==key){ el._h=key; el.innerHTML=html; tick(); } }
function secLeft(dl){ return Math.max(0,Math.ceil((dl-DB.now())/1000)); }
function cdSpan(dl,cls='cd'){ return `<span class="${cls}" data-dl="${dl}">${secLeft(dl)}</span>`; }
const TB={};
function timebar(dl){ return dl?`<div class="tbar"><i data-tb="${dl}"></i></div>`:''; }
function tick(){
  document.querySelectorAll('[data-dl]').forEach(e=>{ const v=secLeft(+e.dataset.dl); if(e.textContent!=String(v)) e.textContent=v; });
  document.querySelectorAll('[data-tb]').forEach(e=>{ const dl=+e.dataset.tb; const left=Math.max(0,dl-DB.now()); if(!TB[dl]) TB[dl]=Math.max(left,1000);
    const r=Math.min(1,left/TB[dl]); e.style.width=(r*100)+'%'; e.parentNode.classList.toggle('low', left<10000); });
}
setInterval(tick,250);
function josa(name,a,b){ const c=name.charCodeAt(name.length-1); if(c<0xAC00||c>0xD7A3) return name+a; return name+(((c-0xAC00)%28)?a:b); } // a:받침있음 b:없음

const S = { role:null, code:null, pid:null, name:null, R:null, off:null, hostSid:null, ui:{} };
function settings(){ return Object.assign(defaultSettings(), S.R?.meta?.settings||{}); }
function defaultSettings(){ return {rounds:3, writeSec:90, turnSec:30, claimSec:15, voteSec:15, custom:'', useBase:true, autoNext:true, autoSec:15, teacherJudge:false}; }
function cellsOf(pid,round){ return S.R?.boards?.[pid]?.['r'+round] || {}; }
function filledCount(cells){ let n=0; for(let i=0;i<9;i++) if(cells['c'+i]?.t) n++; return n; }
function unmarked(cells){ const a=[]; for(let i=0;i<9;i++){ const x=cells['c'+i]; if(x?.t && !x.m) a.push(i); } return a; }
function topicCount(cells,tp){ let n=0; for(let i=0;i<9;i++) if(cells['c'+i]?.t && cells['c'+i].tp===tp) n++; return n; }
const LINE_B=[3,2,1,1,2,3]; // 가로(위→아래) 3·2·1, 세로(왼→오) 1·2·3 — 원작 보드
function calcScore(cells){
  cells=cells||{}; let o=0,s=0,l=0; const M=i=>cells['c'+i]?.m==='o';
  for(let i=0;i<9;i++){ if(M(i)) o++; if(cells['c'+i]?.s) s++; }
  LINES.forEach((L,k)=>{ if(L.every(M)) l+=LINE_B[k]; });
  return {o,s,l,total:o+s*2+l};
}
function players(){ return S.R?.players||{}; }
function pname(pid){ return players()[pid]?.name || '?'; }
function isOnline(pid){ const p=players()[pid]; return !!(p && p.conn && Object.keys(p.conn).length); }
function sortedPids(onlyOnline){ return Object.keys(players()).filter(p=>players()[p]?.name && (!onlyOnline||isOnline(p))).sort((a,b)=>(players()[a].joinedAt||0)-(players()[b].joinedAt||0)); }
function totalScore(pid){
  const st=S.R?.state||{}; const sc=S.R?.scores?.[pid]||{}; let t=0;
  for(const k in sc) t+= +sc[k]||0;
  if(st.round && !sc['r'+st.round] && ['turn','claim','vote','result','write','topic'].includes(st.phase)) t+=calcScore(cellsOf(pid,st.round)).total;
  return t;
}
function deck(){ const s=settings(); const custom=(s.custom||'').split('\n').map(x=>x.trim()).filter(Boolean); return (s.useBase!==false?TOPICS:[]).concat(custom); }
function rosterOf(round){ return sortedPids(false).filter(p=>filledCount(cellsOf(p,round))>0); }

function boardHTML(cells,o={}){
  cells=cells||{}; const M=i=>cells['c'+i]?.m==='o';
  let h=`<div class="board ${o.mini?'mini':''} ${o.calm?'calm':''}" style="--fr:${o.color||'#2f80ed'}">`;
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      const i=r*3+c, x=cells['c'+i]; const cls=['cell'];
      let inner='';
      if(x?.t){
        cls.push('tp'+(x.tp||0)); const L=[...x.t].length; if(L>9) cls.push('l3'); else if(L>5) cls.push('l2');
        if(x.m==='o') cls.push('m-o'); if(x.m==='x') cls.push('m-x'); if(x.s) cls.push('star-on');
        inner=`<span class="tag">${(x.tp||0)+1}</span>${esc(x.t)}`;
      } else { cls.push('empty'); inner = o.mini?'':'＋'; }
      inner+=`<span class="star">★</span>`;
      if(o.click && o.click.includes(i)) cls.push('click');
      if(o.sel===i) cls.push('sel');
      if(o.hl===i) cls.push('hl');
      const on = (o.click && o.click.includes(i) && o.onclick) ? ` onclick="${o.onclick}(${i})"` : '';
      h+=`<div class="${cls.join(' ')}"${on}>${inner}</div>`;
    }
    h+=`<div class="bonus ${[0,1,2].every(c=>M(r*3+c))?'on':''}"><span>${LINE_B[r]}</span></div>`;
  }
  for(let c=0;c<3;c++) h+=`<div class="bonus ${[0,1,2].every(r=>M(r*3+c))?'on':''}"><span>${LINE_B[3+c]}</span></div>`;
  return h+`<div></div></div>`;
}

const A = {};
A.rejoin = () => { const last=JSON.parse(localStorage.getItem('jinxo_me')||'null'); if(!last) return; $('#jcode').value=last.code; $('#jname').value=last.name; A.join(); };
A.join = async ()=>{
  const code=($('#jcode').value||'').trim(); const name=($('#jname').value||'').trim().replace(/\s+/g,' ');
  if(!/^\d{4}$/.test(code)) return toast('방 코드 4자리를 확인해요');
  if(!name) return toast('이름을 써 주세요');
  const meta=await DB.get(roomPath(code)+'/meta');
  if(!meta) return toast('그런 방이 없어요');
  const pid=hashName(name);
  const p=await DB.get(roomPath(code)+'/players/'+pid);
  const back = !!p?.name;           // 같은 이름으로 이미 있던 학생 → 재접속
  const sid=rid();
  await DB.update(roomPath(code)+'/players/'+pid, {name, joinedAt:p?.joinedAt||DB.now(), sid});
  localStorage.setItem('jinxo_me', JSON.stringify({code,name}));
  leaveRoom();
  S.role='stu'; S.code=code; S.pid=pid; S.name=name; S.sid=sid; S.ui={};
  S.pres=DB.presence(roomPath(code)+'/players/'+pid+'/conn/'+sid);
  history.replaceState(null,'',location.pathname+'?room='+code+(DB.mode==='mock'&&/local=1/.test(location.search)?'&local=1':''));
  $('#app').innerHTML=`<div class="stu"><div class="top" id="s-top"></div><div id="s-banner"></div><div id="s-board"></div><div id="s-act"></div></div>`;
  if(back) setTimeout(()=>toast(`다시 왔어요, ${name}! 하던 그대로 이어서 해요 🙌`,2600),200);
  let seen=false;
  S.off=DB.on(roomPath(code), R=>{
    if(!R){ renderHome('방이 사라졌어요'); return; }
    S.R=R; const me=R.players?.[pid];
    if(me?.name) seen=true;
    else if(seen){ renderHome('선생님이 방에서 내보냈어요'); return; }
    if(me?.sid && me.sid!==S.sid){ renderHome('같은 이름으로 다른 화면에서 들어와서, 이 화면은 나갔어요'); return; }
    renderStu();
  });
};
function req(obj){ return DB.set(roomPath(S.code)+'/req/'+S.pid, Object.assign({ts:DB.now()},obj)); }

      if(c.pid===me){ items+=`<div class="vote-item"><div class="who">${esc(cl[p].t)}<small>${esc(pname(p))}</small></div>${reqBtn(p)}</div>`; continue; }
      const v=V[p]?.[me];
      items+=`<div class="vote-item"><div class="who">${esc(cl[p].t)}<small>${esc(pname(p))}</small></div><div class="row">
        <button class="teal sm ${v===1?'on':''}" onclick="A.vote('${p}',1)">👍 같아요</button><button class="pink sm ${v===0?'on':''}" onclick="A.vote('${p}',0)">👎 달라요</button></div>${reqBtn(p)}</div>`;
    }
    ban=`<div class="banner"><div class="small">${tj?'🧑‍🏫 선생님이 판정하고 있어요':`투표 · ${cdSpan(st.deadline)}초`}</div><div class="called">${esc(c.t)}</div><div class="mid">이 답과 같은 뜻일까요?</div><div class="small">하얀색 = 흰색 ✔ · 콜라 ≠ 탄산음료 ✘ · 너무 엄격하진 않게!</div>${!tj&&waitingTeacher(st).length?'<div class="mid wait-t">🙋 선생님 판정을 기다리는 중…</div>':''}${items}</div>`;
    if(st.auto?.[me]!=null) bopt={hl:st.auto[me]};
  } else if(ph==='result'){
    ban=resultBanner(st.result,me);
  } else if(ph==='roundEnd'||ph==='gameEnd'){
    const sc=calcScore(cells);
    const ranks=sortedPids(false).map(p=>({p,t:totalScore(p)})).sort((a,b)=>b.t-a.t);
    const myRank=ranks.findIndex(x=>x.p===me)+1;
    ban=`<div class="banner"><div class="big">${ph==='gameEnd'?'🏆 게임 끝!':`라운드 ${round} 끝!`}</div>
      ${st.finisher?`<div class="small">${esc(pname(st.finisher))}의 보드가 다 찼어요</div>`:''}
      <div class="breakdown"><span>⭕ ${sc.o}</span><span>★ ${sc.s}×2</span><span>줄 +${sc.l}</span><span style="color:var(--yellow)">= ${sc.total}점</span></div>
      <div class="mid" style="margin-top:8px">합계 ${totalScore(me)}점 · ${rankOf(me)}등 / ${ranks.length}명</div>
      ${ph==='roundEnd'&&st.deadline?`<div class="small">⏩ ${cdSpan(st.deadline)}초 뒤 ${round>=s.rounds?'최종 결과':'다음 라운드'}</div>`:''}</div>`;
  }
  if((ph==='claim'||ph==='vote') && !pendingInfo().list.includes(me)) ban=ban.replace(/<\/div>$/, pendingHTML(false)+'</div>');
  setHTML($('#s-banner'),ban);
  bopt.color=pcolor(me);
  const sc0=calcScore(cells);
  setHTML($('#s-board'), (ph==='lobby')?'':boardHTML(cells,bopt)+`<div class="scorestrip"><span>⭕×1 <b>${sc0.o}</b></span><span>★×2 <b>${sc0.s*2}</b></span><span>보너스 <b>${sc0.l}</b></span><span class="tot">이번 라운드 <b>${sc0.total}</b>점</span></div>`);
  setHTML($('#s-act'), (act?`<div class="actions">${act}</div>`:'') + (ph!=='lobby'?rankBox(me):''));
  if(ph!==S.ui.lastPh){ S.ui.lastPh=ph; if(ph!=='write') hideSheet(); if(ph==='claim'||ph==='turn') S.ui.callSel=null; }
}
function specBanner(){ return `<div class="banner"><div class="mid">이번 라운드는 구경해요 👀</div><div class="small">다음 라운드부터 함께해요! (투표는 할 수 있어요)</div></div>`; }
function resultBanner(r,me){
  if(!r) return '';
  const mine = r.who?.includes(me) || r.caller===me;
  if(r.type==='jinx') return `<div class="banner" style="background:var(--pink)"><div class="big">★ 징크스! ★</div><div class="called">${esc(r.t)}</div><div class="mid">${esc(pname(r.caller))} & ${esc(pname(r.who[0]))}</div>${mine?'<div class="mid">⭕+★ 3점!</div>':''}</div>`;
  if(r.type==='match') return `<div class="banner" style="background:var(--teal)"><div class="big">⭕ ${r.who.length+1}명 일치!</div><div class="called">${esc(r.t)}</div>${mine?'<div class="mid">⭕ 1점!</div>':''}<div class="small">${r.who.concat([r.caller]).map(pname).map(esc).join(', ')}</div></div>`;
  return `<div class="banner"><div class="big">✗ 아무도 없어요</div><div class="called">${esc(r.t)}</div><div class="small">${esc(pname(r.caller))}의 답에 ✗</div></div>`;
}
A.pick = i => req({type:'pick',i});
A.cell = i => openWrite(i);
A.callCell = i => {

    <div class="actions"><button class="ghost" onclick="hideSheet()">취소</button><button class="pink" onclick="A.doCall(${i})">🎤 부르기!</button></div>`);
};
A.doCall = i => { hideSheet(); req({type:'call',c:'c'+i}); };
A.claimCell = i => {
  const x=cellsOf(S.pid,S.R.state.round)['c'+i];
  showSheet(`<h3>비슷하다고 신청할까요?</h3><div class="center"><div class="called" style="font-size:24px">${esc(S.R.state.call?.t)}</div> ≈ <div class="called" style="font-size:24px">${esc(x.t)}</div></div>
    <div class="small center muted">${settings().teacherJudge?'선생님이 같은지 정해요':'친구들이 투표로 같은지 정해요'}</div>
    <div class="actions"><button class="ghost" onclick="hideSheet()">취소</button><button class="teal" onclick="hideSheet();A.claim('c${i}')">신청하기</button></div>`);
};
A.claim = v => DB.set(roomPath(S.code)+`/claims/n${S.R.state.callNo}/${S.pid}`, v);
A.jreq = (p,on) => DB.set(roomPath(S.code)+`/jreq/n${S.R.state.callNo}/${p}/${S.pid}`, on?true:null);
A.vote = (p,v) => DB.set(roomPath(S.code)+`/votes/n${S.R.state.callNo}/${p}/${S.pid}`, v);

function openWrite(i){
  const st=S.R.state, round=st.round, cells=cellsOf(S.pid,round), x=cells['c'+i];
  const tps=[0,1,2].filter(t=>t<=st.tIdx);
  let tp = x?.t ? x.tp : (topicCount(cells,st.tIdx)<3 ? st.tIdx : (tps.find(t=>topicCount(cells,t)<3) ?? st.tIdx));
  S.ui.wr={i,tp};
  const chips = tps.map(t=>{ const full=topicCount(cells,t)>=3 && !(x?.t && x.tp===t); return `<button class="t${t} ${t===tp?'':'off'}" ${full?'disabled':''} onclick="A.wtp(${t})">${t+1}. ${esc(st.topics?.['t'+t])} (${topicCount(cells,t)}/3)</button>`; }).join('');
  showSheet(`<h3>${x?.t?'답 고치기':'답 쓰기'}</h3><div class="chips">${chips}</div>
    <input id="ans" maxlength="16" placeholder="2단어 이하로 써요" value="${esc(x?.t||'')}" autocomplete="off">
    <div class="warn" id="warn"></div>
    <div class="actions">${x?.t?`<button class="ghost" onclick="A.wdel()">지우기</button>`:''}<button class="ghost" onclick="hideSheet()">취소</button><button onclick="A.wsave()">✏️ 쓰기</button></div>`);
  const inp=$('#ans'); inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') A.wsave(); });
}
A.wtp = t => { S.ui.wr.tp=t; document.querySelectorAll('#sheet .chips button').forEach((b,k)=>b.classList.toggle('off',k!==t)); };
A.wsave = (force) => {
  const st=S.R.state; if(st.phase!=='write'){ hideSheet(); return; }
  const {i,tp}=S.ui.wr; const v=($('#ans').value||'').trim().replace(/\s+/g,' ');
  const cells=cellsOf(S.pid,st.round);
  if(!v) return $('#warn').textContent='답을 써 주세요';
  for(let k=0;k<9;k++){ if(k!==i && cells['c'+k]?.t && norm(cells['c'+k].t)===norm(v)) return $('#warn').textContent='내 보드에 이미 같은 답이 있어요'; }
  const x=cells['c'+i];
  if(topicCount(cells,tp) >= 3 && !(x?.t && x.tp===tp)) return $('#warn').textContent='이 주제는 벌써 3개를 썼어요';
  if(v.split(' ').length>2 && force!==true){ $('#warn').innerHTML='2단어까지만 써요! (사람·장소 이름은 괜찮아요) <button class="sm pink" onclick="A.wsave(true)">이름이라 그대로 쓰기</button>'; return; }
  DB.set(roomPath(S.code)+`/boards/${S.pid}/r${st.round}/c${i}`, {t:v,tp});
  hideSheet();
};
A.wdel = () => { const st=S.R.state; DB.remove(roomPath(S.code)+`/boards/${S.pid}/r${st.round}/c${S.ui.wr.i}`); hideSheet(); };
function showSheet(html){ const s=$('#sheet'); s.innerHTML=`<div class="in">${html}</div>`; s.classList.remove('hidden'); s.onclick=e=>{ if(e.target===s) hideSheet(); }; }
function hideSheet(){ $('#sheet').classList.add('hidden'); $('#sheet').innerHTML=''; }

/* =========================================================
   선생님 (진행 + 전자칠판 화면)
   ========================================================= */
A.createRoom = async ()=>{
  let code=null;
  for(let k=0;k<30;k++){ const c=String(1000+rand(9000)); const m=await DB.get(roomPath(c)+'/meta'); if(!m || DB.now()-(m.created||0)>12*3600e3){ code=c; break; } }
  if(!code) return toast('방 코드를 만들지 못했어요. 다시 눌러 주세요');
  const sid=rid();
  await DB.set(roomPath(code), {meta:{created:DB.now(), hostSid:sid, settings:defaultSettings()}, state:{phase:'lobby',round:0}});
  localStorage.setItem('jinxo_host', JSON.stringify({code,sid}));
  enterHost(code,sid);
};
A.resumeHost = async ()=>{
  const h=JSON.parse(localStorage.getItem('jinxo_host')||'null'); if(!h) return;
  const m=await DB.get(roomPath(h.code)+'/meta'); if(!m){ localStorage.removeItem('jinxo_host'); return renderHome('그 방은 없어졌어요'); }
  enterHost(h.code,h.sid);
};
function enterHost(code,sid){
  S.role='host'; S.code=code; S.hostSid=sid; S.ui={boards:false};
  $('#app').innerHTML=`<div class="host">
    <div class="hd"><div class="logo"><span class="j">징크스</span><span class="o">O</span></div><div id="h-info" class="mid"></div><div class="code" onclick="A.qrBig()" style="cursor:pointer" title="QR 크게 보기">📱 방 코드<b>${code}</b></div></div>
    <div class="stage" id="h-stage"></div>
    <div class="side" id="h-side"></div>
    <div class="ctrl" id="h-ctrl"></div>
  </div><div id="h-over"></div>`;
  S.off=DB.on(roomPath(code), R=>{ if(!R){ localStorage.removeItem('jinxo_host'); renderHome('방이 없어졌어요'); return; } S.R=R; renderHost(); hostStep(); });
}
const isActiveHost = () => S.role==='host' && S.R?.meta?.hostSid===S.hostSid;
A.takeover = () => DB.set(roomPath(S.code)+'/meta/hostSid', S.hostSid);
setInterval(()=>{ if(S.role==='host' && S.R) hostStep(); },400);
setInterval(()=>{ if(S.role==='host' && S.R) renderHost(); },1000);

        <label>기본 주제 카드 ${TOPICS.length}개 쓰기</label><input type="checkbox" style="width:28px;height:28px" ${s.useBase!==false?'checked':''} onchange="A.set('useBase',this.checked)">

      </div></details>`;
    ctrl=`<button class="pink" style="font-size:26px;padding:14px 40px" ${n<2?'disabled':''} onclick="A.startGame()">▶ 게임 시작 (${n}명)</button>`;
  } else if(ph==='topic'){
    stage=`<div class="mid">주제 ${st.tIdx+1}/3 · <span class="cdbig">${cdSpan(st.deadline,'')}</span></div>
      <div class="big" style="margin-top:8px">🃏 ${esc(pname(st.picker))}의 주제 고르기</div>

    const c=st.call, auto=st.auto||{}; const C=R.claims?.['n'+st.callNo]||{};

    stage=`<div class="mid">${esc(pname(c.pid))}의 답</div><div class="called" style="margin:10px 0">${esc(c.t)}</div>

    ctrl=`<button class="teal" onclick="A.judgeAll(1)">✅ 모두 인정</button><button class="ghost" onclick="A.judgeAll(0)">❌ 모두 불인정</button><button class="pink" onclick="A.resolve()">⚖️ ${s.teacherJudge?'판정 끝':'지금 판정하기'}</button>`;
  } else if(ph==='result'){
    const r=st.result;
    if(r.type==='jinx') stage=`<div class="result-jinx">★ 징크스! ★</div><div class="called" style="margin:14px 0">${esc(r.t)}</div><div class="big">${esc(pname(r.caller))} & ${esc(pname(r.who[0]))} <span style="color:var(--yellow)">+3점</span></div>`;
    else if(r.type==='match') stage=`<div class="result-match">⭕ ${r.who.length+1}명 일치!</div><div class="called" style="margin:14px 0">${esc(r.t)}</div><div class="chips">${[r.caller].concat(r.who).map(p=>`<span class="chip">${esc(pname(p))}</span>`).join('')}</div>`;
    else stage=`<div class="result-miss">✗ 아무도 없어요</div><div class="called" style="margin:14px 0">${esc(r.t)}</div><div class="mid">${esc(pname(r.caller))}의 답에 ✗</div>`;
    if(r.acc && Object.keys(r.acc).length) stage+=`<div class="muted" style="margin-top:10px">투표로 인정: ${Object.keys(r.acc).map(p=>esc(pname(p))+' ‘'+esc(r.acc[p])+'’').join(', ')}</div>`;
    ctrl=`<button class="ghost" onclick="A.afterResult()">다음 ▶</button>`;
  } else if(ph==='roundEnd' || ph==='gameEnd'){
    const ranks=sortedPids(false).map(p=>({p,t:totalScore(p),r:+(R.scores?.[p]?.['r'+st.round]??0)})).sort((a,b)=>b.t-a.t);
    if(S.ui.boards){
      stage=`<div class="big">라운드 ${st.round} 모든 보드</div><div class="boards">${rosterOf(st.round).map(p=>`<div><div class="nm">${esc(pname(p))} · ${calcScore(cellsOf(p,st.round)).total}점</div>${boardHTML(cellsOf(p,st.round),{mini:true,color:pcolor(p)})}</div>`).join('')}</div>`;
    } else if(ph==='gameEnd'){
      const t3=ranks.slice(0,3);
      stage=`<div class="huge">🏆 최종 결과</div>${st.stopped?`<div class="mid muted">(라운드 ${st.round}에서 중단 — 지금까지 점수)</div>`:''}
        <div class="podium">${t3[1]?`<div class="p2">2등<br>${esc(pname(t3[1].p))}<br>${t3[1].t}점</div>`:''}${t3[0]?`<div class="p1">👑 1등<br>${esc(pname(t3[0].p))}<br>${t3[0].t}점</div>`:''}${t3[2]?`<div class="p3">3등<br>${esc(pname(t3[2].p))}<br>${t3[2].t}점</div>`:''}</div>
        ${rankTable(ranks,st.round)}`;
    } else {
      stage=`<div class="big">라운드 ${st.round} 끝!</div>${st.finisher?`<div class="mid muted">${esc(pname(st.finisher))}의 보드가 모두 채워졌어요</div>`:''}${rankTable(ranks,st.round)}`;
    }
    if(ph==='roundEnd' && st.deadline){
      stage+=`<div class="mid" style="margin-top:14px">⏩ <span class="cdbig">${cdSpan(st.deadline,'')}</span>초 뒤 ${st.round>=s.rounds?'최종 결과':`라운드 ${st.round+1} 자동 시작`}</div>`;
    }
    ctrl=(ph==='roundEnd'&&st.deadline?`<button class="ghost" onclick="A.pauseAuto()">⏸ 멈추기</button>`:'')+`<button class="ghost" onclick="A.toggleBoards()">${S.ui.boards?'📊 순위 보기':'🔍 모든 보드 보기'}</button>`+
      (ph==='roundEnd'? (st.round>=s.rounds?`<button class="pink" onclick="A.finish()">🏆 최종 결과</button>`:`<button class="pink" onclick="A.nextRound()">▶ 라운드 ${st.round+1} 시작</button>`)
        : `<button class="pink" onclick="A.resetGame()">🔁 다시 하기 (같은 방)</button><button class="ghost" onclick="A.closeRoom()">방 닫기</button>`);
  }
  if(ph && !['lobby','gameEnd'].includes(ph)) ctrl+=`<button class="ghost stopbtn" onclick="A.stopGame()">⏹ 게임 중단</button>`;
  setHTML($('#h-stage'),stage); setHTML($('#h-ctrl'),ctrl);
  if(ph==='lobby'){
    const L=sortedPids(false);
    setHTML($('#lob-n'), `<b style="color:var(--yellow)">${L.length}명</b>`);
    setHTML($('#lob-players'), L.length? L.map(p=>`<span class="lp ${isOnline(p)?'':'off'}">${esc(pname(p))}<button title="내보내기" onclick="A.kick('${p}')">✕</button></span>`).join('') : '<span class="muted">아직 아무도 없어요</span>');
  }
  setHTML($('#h-side'),sideHTML());
}
function rankTable(ranks,round){
  return `<table class="rank"><tr><th>순위</th><th style="text-align:left">이름</th><th style="text-align:right">라운드 ${round}</th><th style="text-align:right">합계</th></tr>${ranks.map((x,k)=>`<tr class="${k<3?'top':''}"><td class="center">${k+1}</td><td>${esc(pname(x.p))}</td><td class="n">${x.r}</td><td class="n">${x.t}</td></tr>`).join('')}</table>`;
}
function pendingInfo(){
  const R=S.R, st=R.state||{}, ph=st.phase;
  if(ph==='write'){ const L=sortedPids(true).filter(p=>topicCount(cellsOf(p,st.round),st.tIdx)<3); return {label:'아직 다 못 쓴 친구', list:L, extra:p=>` ${topicCount(cellsOf(p,st.round),st.tIdx)}/3`}; }
  if(ph==='claim'){ const C=R.claims?.['n'+st.callNo]||{}; return {label:'아직 응답 안 한 친구', list:claimEligible().filter(p=>C[p]==null), extra:()=>''}; }
  if(ph==='vote' && settings().teacherJudge) return null;
  if(ph==='vote'){ const V=R.votes?.['n'+st.callNo]||{}; const cl=Object.keys(st.claims||{}); return {label:'아직 투표 안 한 친구', list:voters(st).filter(v=>!cl.every(c=>c===v||V[c]?.[v]!=null)), extra:()=>''}; }
  if(ph==='topic') return {label:'주제 고르는 친구', list:st.picker?[st.picker]:[], extra:()=>''};
  return null;
}
function pendingHTML(big){
  const pi=pendingInfo(); if(!pi) return '';
  if(!pi.list.length) return `<div class="pend done">✅ 모두 완료!</div>`;
  return `<div class="pend ${big?'big':''}"><div class="pl">⏳ ${pi.label} <b>${pi.list.length}명</b></div><div class="chips">${pi.list.map(p=>`<span class="chip w">${esc(pname(p))}${pi.extra(p)}</span>`).join('')}</div></div>`;
}
function rankOf(pid){ const t=totalScore(pid); return sortedPids(false).filter(p=>totalScore(p)>t).length+1; }
function rankBox(me){
  const L=sortedPids(false).map(p=>({p,t:totalScore(p)})).sort((a,b)=>b.t-a.t); if(!L.length) return '';
  const top=L.slice(0,5); const mi=L.findIndex(x=>x.p===me);
  const row=x=>{ const r=rankOf(x.p); return `<div class="rrow ${x.p===me?'me':''}"><span class="rk">${['🥇','🥈','🥉'][r-1]||r+'등'}</span><span class="nm">${esc(pname(x.p))}</span><b>${x.t}점</b></div>`; };
  return `<div class="rankbox"><div class="rt">🏆 실시간 순위 <small>${L.length}명</small></div>${top.map(row).join('')}${mi>=5?`<div class="rdots">⋯</div>`+row(L[mi]):''}</div>`;
}
function tally(v){ let y=0,n=0; for(const k in v||{}){ if(v[k]===1) y++; else if(v[k]===0) n++; } return {y,n}; }
function sideHTML(){
  const R=S.R, st=R.state||{}; const ph=st.phase;
  const list=sortedPids(false).map(p=>({p,t:totalScore(p)}));
  if(ph!=='lobby') list.sort((a,b)=>b.t-a.t);
  const cur = ph==='turn'? st.order[st.turn] : (ph==='claim'||ph==='vote')? st.call?.pid : null;
  const C=R.claims?.['n'+st.callNo]||{}, V=R.votes?.['n'+st.callNo]||{};
  return `<h3><span>참가자</span><span>${sortedPids(true).length}명</span></h3><ul class="plist">${list.map(({p,t})=>{
    let stx='';
    if(ph==='write') stx=topicCount(cellsOf(p,st.round),st.tIdx)+'/3';
    else if(ph==='claim') stx = st.auto?.[p]!=null?'✨': C[p]==='-'?'✓': C[p]?'🙋':'';
    else if(ph==='vote') stx = Object.keys(st.claims||{}).some(c=>V[c]?.[p]!=null)?'✓':'';
    else if(['turn','result'].includes(ph) && !(st.order||[]).includes(p)) stx='👀';
    const rk = (ph==='lobby'||t<=0)?'<span class="rk"></span>':`<span class="rk">${['🥇','🥈','🥉'][rankOf(p)-1]||rankOf(p)}</span>`;
    const pi=pendingInfo(); const waiting=pi && pi.list.includes(p) && ph!=='topic';
    return `<li class="${p===cur?'act':''} ${waiting?'wait':''}">${rk}<span class="dot ${isOnline(p)?'':'off'}"></span><span class="nm">${esc(pname(p))}</span><span class="st">${stx}</span>${ph!=='lobby'?`<span class="sc">${t}</span>`:''}<button class="kick" title="내보내기" onclick="A.kick('${p}')">✕</button></li>`;
  }).join('')}</ul>`;
}

/* ---------- 선생님 조작 ---------- */
const room = () => roomPath(S.code);
let lock=false;
function commit(upd){
  lock=true;
  let pr;
  try{ pr=Promise.resolve(DB.update(room(), JSON.parse(JSON.stringify(upd)))); } // undefined 값 제거 (Firebase는 undefined가 있으면 저장을 거부함)
  catch(e){ pr=Promise.reject(e); }
  return pr.catch(e=>{ console.error(e); toast('저장 실패: '+e.message,3500); }).finally(()=>{ setTimeout(()=>{lock=false;},150); });
}
const LOBBY_RESET = () => ({state:{phase:'lobby',round:0}, boards:null, scores:null, hist:null, claims:null, votes:null, jreq:null, req:null});
function st0(){ return JSON.parse(JSON.stringify(S.R.state||{})); }

A.set = (k,v) => { if(['rounds','writeSec','turnSec','claimSec','voteSec','autoSec'].includes(k)) v=Math.max(0,parseInt(v)||0); DB.set(room()+'/meta/settings/'+k, v); };
A.kick = p => { if(!confirm(`${pname(p)} 학생을 내보낼까요?\n(같은 이름으로 다시 들어오면 새로 참가해요)`)) return; const u={}; u['players/'+p]=null; u['boards/'+p]=null; u['scores/'+p]=null; u['req/'+p]=null; commit(u); };
A.qrBig = () => {
  const o=document.createElement('div'); o.className='overlay qrbig'; o.onclick=()=>o.remove();
  o.innerHTML=`<div class="qrbox">${qrSVG(joinURL())}</div><div style="color:#fff;font-family:Jua;font-size:clamp(34px,5vw,72px)">방 코드 <span style="color:var(--yellow);letter-spacing:6px">${S.code}</span></div><div class="mid" style="color:#ddd;word-break:break-all">${esc(joinURL())}</div><div class="muted">아무 곳이나 누르면 닫혀요</div>`;
  document.body.appendChild(o);
};
A.toggleBoards = () => { S.ui.boards=!S.ui.boards; renderHost(); };

function drawCands(st){
  const D=deck(); const used=st.used||{}; let pool=D.map((t,i)=>i).filter(i=>!used['i'+i]);
  if(pool.length<2){ st.used={}; pool=D.map((t,i)=>i); }
  const out=[]; while(out.length<2 && pool.length){ out.push(pool.splice(rand(pool.length),1)[0]); }
  st.candIdx=out; st.cands=out.map(i=>D[i]);
}
function enterTopic(st,tIdx){
  st.phase='topic'; st.tIdx=tIdx; drawCands(st);
  const P=sortedPids(true); let k=P.indexOf(st.first); if(k<0) k=0;
  st.picker = P.length? P[(k+tIdx)%P.length] : null;
  st.deadline=DB.now()+25000;
  return st;
}
A.startGame = () => {
  const P=sortedPids(true); if(P.length<2) return toast('2명 이상 들어와야 해요');
  const st={phase:'lobby',round:1,callNo:0,first:P[rand(P.length)],topics:{}};
  enterTopic(st,0);
  commit({state:st, boards:null, scores:null, hist:null, claims:null, votes:null, jreq:null, req:null});
};
A.hpick = i => chooseTopic(i);
A.redraw = () => { const st=st0(); drawCands(st); st.deadline=DB.now()+25000; commit({state:st}); };
function chooseTopic(i){
  const st=st0(); if(st.phase!=='topic') return;
  st.topics=st.topics||{}; st.topics['t'+st.tIdx]=st.cands[i];
  st.used=st.used||{}; st.used['i'+st.candIdx[i]]=true;
  st.phase='write'; st.deadline=DB.now()+settings().writeSec*1000; S.ui.allDoneAt=null;
  commit({state:st});
}
A.addTime = sec => { const st=st0(); st.deadline=Math.max(st.deadline,DB.now())+sec*1000; commit({state:st}); };
A.endWrite = () => endWrite();
function endWrite(){
  const st=st0(); if(st.phase!=='write') return;
  if(st.tIdx<2){ enterTopic(st,st.tIdx+1); return commit({state:st}); }
  startCalling(st);
}
function startCalling(st){
  const ros=rosterOf(st.round);
  if(!ros.length){ toast('답을 쓴 학생이 없어요'); st.phase='roundEnd'; return finishRound(st,null); }
  let k=ros.indexOf(st.first); if(k<0) k=0;
  st.order=ros.slice(k).concat(ros.slice(0,k));
  st.turn=-1; st.msg='';
  const nx=nextEligible(st);
  if(nx<0) return finishRound(st,null);
  st.turn=nx; st.phase='turn'; st.deadline=DB.now()+settings().turnSec*1000; st.turnStart=DB.now();
  commit({state:st});
}
function nextEligible(st){
  const n=st.order.length;
  for(let k=1;k<=n;k++){ const i=(st.turn+k+n)%n; const p=st.order[i]; if(isOnline(p) && unmarked(cellsOf(p,st.round)).length) return i; }
  return -1;
}
A.skip = () => { const st=st0(); if(st.phase!=='turn') return; goNextTurn(st,`${pname(st.order[st.turn])} 차례를 건너뛰었어요`); };
function goNextTurn(st,msg){
  const nx=nextEligible(st);
  if(nx<0) return finishRound(st,null);
  st.turn=nx; st.phase='turn'; st.msg=msg||''; st.deadline=DB.now()+settings().turnSec*1000; st.turnStart=DB.now();
  delete st.call; delete st.auto; delete st.claims; delete st.ovr; delete st.result;
  commit({state:st});
}
function doCall(pid,ci){
  const st=st0(); if(st.phase!=='turn' || st.order[st.turn]!==pid) return;
  const cells=cellsOf(pid,st.round); const x=cells['c'+ci]; if(!x?.t || x.m) return;
  const n=norm(x.t); const auto={};
  for(const p of st.order){ if(p===pid) continue; const cs=cellsOf(p,st.round); for(let i=0;i<9;i++){ const y=cs['c'+i]; if(y?.t && !y.m && norm(y.t)===n){ auto[p]=i; break; } } }
  st.callNo=(st.callNo||0)+1; st.call={pid,c:ci,t:x.t}; st.auto=auto; delete st.claims; delete st.ovr;
  st.phase='claim'; st.deadline=DB.now()+settings().claimSec*1000; st.msg='';
  if(!claimEligibleFor(st).length){ st.phase='claim'; st.deadline=DB.now()+1500; }
  commit({state:st});
}
function claimEligibleFor(st){ return (st.order||[]).filter(p=>p!==st.call.pid && st.auto?.[p]==null && isOnline(p) && unmarked(cellsOf(p,st.round)).length); }
function claimEligible(){ return claimEligibleFor(S.R.state); }
A.endClaim = () => endClaim();
function endClaim(){
  const st=st0(); if(st.phase!=='claim') return;
  const C=S.R.claims?.['n'+st.callNo]||{}; const cl={};
  for(const p in C){ const v=C[p]; if(!v||v==='-'||p===st.call.pid||st.auto?.[p]!=null||!(st.order||[]).includes(p)) continue; const i=+String(v).slice(1); const x=cellsOf(p,st.round)['c'+i]; if(x?.t && !x.m) cl[p]={c:i,t:x.t}; }
  if(!Object.keys(cl).length) return resolveCall(st);
  st.claims=cl; st.ovr={}; st.phase='vote'; st.deadline=DB.now()+settings().voteSec*1000;
  commit({state:st});
}
function voters(st){ return sortedPids(true).filter(p=>p!==st.call.pid); }
function jreqOf(st){ return S.R.jreq?.['n'+st.callNo]||{}; }   // {claimPid:{요청한pid:true}}
function waitingTeacher(st){ const J=jreqOf(st); return Object.keys(st.claims||{}).filter(c=>J[c] && Object.keys(J[c]).length && st.ovr?.[c]!==0 && st.ovr?.[c]!==1); }
function allJudged(st){ const cl=Object.keys(st.claims||{}); return cl.length>0 && cl.every(c=>st.ovr?.[c]===0||st.ovr?.[c]===1); }
function allVoted(st){
  if(settings().teacherJudge) return false;
  const V=S.R.votes?.['n'+st.callNo]||{}; const vs=voters(st); const cl=Object.keys(st.claims||{});
  return vs.length>0 && vs.every(v=>cl.every(c=>c===v || V[c]?.[v]!=null));
}
A.judge = (p,v) => { const st=st0(); if(st.phase!=='vote') return; st.ovr=st.ovr||{}; if(st.ovr[p]===v) delete st.ovr[p]; else st.ovr[p]=v; commit({state:st}); };
A.judgeAll = v => { const st=st0(); if(st.phase!=='vote') return; st.ovr={}; Object.keys(st.claims||{}).forEach(p=>st.ovr[p]=v); commit({state:st}); };
A.ovr = p => { const st=st0(); st.ovr=st.ovr||{}; const o=st.ovr[p]; st.ovr[p]= o===undefined?1: o===1?0: null; if(st.ovr[p]===null) delete st.ovr[p]; commit({state:st}); };
A.resolve = () => resolveCall(st0());
function resolveCall(st){
  if(!['claim','vote'].includes(st.phase)) return;
  const V=S.R.votes?.['n'+st.callNo]||{}; const acc={}; const who=Object.keys(st.auto||{}); const whoCell={...(st.auto||{})};
  for(const p in (st.claims||{})){
    const o=st.ovr?.[p]; const t=tally(V[p]); const ok = o===1 || (o===undefined && t.y>t.n);
    if(ok){ acc[p]=st.claims[p].t; who.push(p); whoCell[p]=st.claims[p].c; }
  }
  const r=st.round, caller=st.call.pid, u={};
  const B=(p,i)=>`boards/${p}/r${r}/c${i}`;
  let type;
  if(who.length===0){ type='miss'; u[B(caller,st.call.c)+'/m']='x'; }
  else if(who.length===1){ type='jinx'; u[B(caller,st.call.c)+'/m']='o'; u[B(caller,st.call.c)+'/s']=true; u[B(who[0],whoCell[who[0]])+'/m']='o'; u[B(who[0],whoCell[who[0]])+'/s']=true; }
  else { type='match'; u[B(caller,st.call.c)+'/m']='o'; who.forEach(p=>u[B(p,whoCell[p])+'/m']='o'); }
  st.result={type,caller,t:st.call.t,who,acc};
  st.phase='result'; st.deadline=DB.now()+(type==='jinx'?5000:type==='match'?4000:3500);
  u.state=st;
  u[`hist/r${r}/n${st.callNo}`]={n:st.callNo,t:st.call.t,p:pname(caller),type,k:who.length,q:type==='jinx'?pname(who[0]):''};
  commit(u);
}
A.afterResult = () => afterResult();
function afterResult(){
  const st=st0(); if(st.phase!=='result') return;
  const fin=(st.order||[]).find(p=>{ const cs=cellsOf(p,st.round); return filledCount(cs)===9 && unmarked(cs).length===0; });
  if(fin) return finishRound(st,fin);
  goNextTurn(st,'');
}
A.endRound = () => { if(confirm('이번 라운드를 끝낼까요?')) finishRound(st0(),null); };
function finishRound(st,fin){
  const u={};
  rosterOf(st.round).forEach(p=>{ u[`scores/${p}/r${st.round}`]=calcScore(cellsOf(p,st.round)).total; });
  st.phase='roundEnd'; st.finisher=fin||null; delete st.call; delete st.auto; delete st.claims; delete st.ovr; delete st.result; delete st.deadline;
  if(settings().autoNext!==false) st.deadline=DB.now()+Math.max(5,settings().autoSec||15)*1000;
  u.state=st; S.ui.boards=false;
  commit(u);
}
A.nextRound = () => {
  const st=st0(); const ros=rosterOf(st.round).filter(isOnline);
  let low=null, lv=Infinity; (ros.length?ros:sortedPids(true)).forEach(p=>{ const v=+(S.R.scores?.[p]?.['r'+st.round]??0); if(v<lv || (v===lv && Math.random()<.5)){ lv=v; low=p; } });
  if(!low && !sortedPids(true).length){ toast('접속한 학생이 없어요'); return; }
  st.round++; st.first=low||sortedPids(true)[0]||sortedPids(false)[0]; st.topics={}; delete st.order; delete st.finisher;
  enterTopic(st,0); S.ui.boards=false;
  commit({state:st});
};
A.pauseAuto = () => { const st=st0(); delete st.deadline; commit({state:st}); };
A.finish = () => { const st=st0(); st.phase='gameEnd'; delete st.deadline; S.ui.boards=false; commit({state:st}); };
A.resetGame = () => { if(!confirm('점수를 지우고 처음부터 다시 할까요?')) return; commit(LOBBY_RESET()); };
A.stopGame = () => {
  const o=document.createElement('div'); o.className='overlay'; o.id='stop-over';
  o.innerHTML=`<div style="font-family:Jua;font-size:40px">게임을 멈출까요?</div>
    <button class="pink" style="font-size:24px;padding:14px 30px" onclick="A.stopToResult()">🏆 지금까지 점수로 결과 보기</button>
    <button class="ghost" style="font-size:22px;padding:12px 26px" onclick="A.stopToLobby()">↩ 대기 화면으로 (점수 지우기)</button>
    <button style="font-size:20px" onclick="document.getElementById('stop-over').remove()">계속 하기</button>`;
  document.body.appendChild(o);
};
A.stopToResult = () => {
  document.getElementById('stop-over')?.remove();
  const st=st0(); const u={};
  if(st.round && st.phase!=='roundEnd' && st.phase!=='gameEnd') rosterOf(st.round).forEach(p=>{ u[`scores/${p}/r${st.round}`]=calcScore(cellsOf(p,st.round)).total; });
  u.state={phase:'gameEnd', round:st.round||0, stopped:true}; S.ui.boards=false;
  commit(u);
};
A.stopToLobby = () => { document.getElementById('stop-over')?.remove(); commit(LOBBY_RESET()); };
A.closeRoom = () => { if(!confirm('방을 닫을까요? 학생들도 모두 나가게 돼요.')) return; localStorage.removeItem('jinxo_host'); const c=S.code; if(S.off){S.off();S.off=null;} DB.remove(roomPath(c)); renderHome(); };

/* ---------- 진행 엔진 (선생님 화면이 담당) ---------- */
function hostStep(){
  if(!isActiveHost() || lock) return;
  const R=S.R, st=R.state||{}, now=DB.now(), s=settings();
  if(st.phase && st.phase!=='lobby' && sortedPids(false).length===0){ toast('참가자가 아무도 없어서 대기 화면으로 돌아가요',3000); commit(LOBBY_RESET()); return; }
  const reqs=R.req||{};
  for(const p in reqs){
    const q=reqs[p]; lock=true;
    Promise.resolve(DB.remove(room()+'/req/'+p)).finally(()=>{ lock=false;
      if(q.type==='pick' && st.phase==='topic' && st.picker===p) chooseTopic(q.i);
      else if(q.type==='call') doCall(p,+String(q.c).slice(1));
    });
    return;
  }
  switch(st.phase){
    case 'topic': if(now>st.deadline) chooseTopic(rand((st.cands||[]).length||1)); break;
    case 'write': {
      const pl=sortedPids(true); const all=pl.length>0 && pl.every(p=>topicCount(cellsOf(p,st.round),st.tIdx)>=3);
      if(all){ if(!S.ui.allDoneAt) S.ui.allDoneAt=now; } else S.ui.allDoneAt=null;
      if(now>st.deadline || (S.ui.allDoneAt && now-S.ui.allDoneAt>2000)){ S.ui.allDoneAt=null; endWrite(); }
      break; }
    case 'turn': { const p=st.order[st.turn];
      if(now>st.deadline) goNextTurn(st0(),`${pname(p)} 시간 초과 — 다음 사람!`);
      else if(!isOnline(p) && now-(st.turnStart||0)>4000) goNextTurn(st0(),`${pname(p)} 접속이 끊겨서 넘어가요`);
      break; }
    case 'claim': {
      const C=R.claims?.['n'+st.callNo]||{}; const el=claimEligible();
      if(now>st.deadline || (el.length && el.every(p=>C[p]!=null))) endClaim();
      break; }
    case 'vote': if(waitingTeacher(st).length) { S.ui.judgedAt=null; break; }
      if((!s.teacherJudge && now>st.deadline) || allVoted(st)) resolveCall(st0());
      else if(allJudged(st)){ if(!S.ui.judgedAt) S.ui.judgedAt=now; else if(now-S.ui.judgedAt>800){ S.ui.judgedAt=null; resolveCall(st0()); } }
      else S.ui.judgedAt=null;
      break;
    case 'result': if(now>st.deadline) afterResult(); break;
    case 'roundEnd': if(st.deadline && now>st.deadline){ if(st.round>=s.rounds) A.finish(); else A.nextRound(); } break;
  }
}

/* ---------------- 시작 ---------------- */
(async()=>{
  try{ await DB.init(); }catch(e){ console.error(e); document.getElementById('app').innerHTML='<div class="home"><div class="banner" style="background:var(--pink)">Firebase를 불러오지 못했어요. 인터넷 연결과 설정을 확인해 주세요.</div></div>'; return; }
  if(DB.mode==='mock'){ const mb=$('#modebar'); mb.textContent='🧪 로컬 테스트 모드 — 같은 브라우저의 탭끼리만 연결돼요 (FIREBASE_CONFIG를 넣으면 온라인 방이 돼요)'; mb.classList.remove('hidden'); document.body.classList.add('hasbar'); }
  renderHome();
})();
</script>
